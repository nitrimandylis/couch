<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>couch</title>
  <meta name="description" content="Watch a film together from two places, in sync.">
  <meta name="theme-color" content="#060a12">
  <link rel="icon" href="/favicon.svg" type="image/svg+xml">
  <link rel="preload" href="/fonts/space-grotesk.woff2" as="font" type="font/woff2" crossorigin>
  <link rel="stylesheet" href="/style.css">
</head>
<body>
  <main class="panel">
    <button class="sign" id="make">couch</button>
    <p class="lead">Watch a film together from two places.</p>
    <p>Each of you streams your own copy. couch keeps the pause, play and skip in step. Press the sign to make a room, then bookmark it and send the link to whoever you are watching with.</p>
  </main>
  <script>
    // A room is just an unguessable path. Ten random base-36 characters.
    document.getElementById("make").addEventListener("click", () => {
      const bytes = crypto.getRandomValues(new Uint8Array(10));
      let id = "";
      for (const b of bytes) id += (b % 36).toString(36);
      location.href = "/r/" + id;
    });
  </script>
</body>
</html>
