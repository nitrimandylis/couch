<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>couch</title>
  <meta name="theme-color" content="#060a12">
  <meta name="robots" content="noindex">
  <link rel="icon" href="/favicon.svg" type="image/svg+xml">
  <link rel="preload" href="/fonts/space-grotesk.woff2" as="font" type="font/woff2" crossorigin>
  <link rel="stylesheet" href="/style.css">
</head>
<body>
  <!-- Entry gate: the click on "sit down" is what lets the player autoplay with sound. -->
  <section class="panel" id="gate">
    <p id="gate-film"></p>
    <div class="name" id="name-field" hidden>
      <label for="name">Your name, so the other person knows who paused</label>
      <input id="name" maxlength="24" autocomplete="given-name" spellcheck="false">
    </div>
    <button class="sign" id="sit">sit down</button>
    <p id="gate-peer"></p>
  </section>

  <section class="panel" id="empty" hidden>
    <form class="search" id="search" autocomplete="off">
      <label class="visually-hidden" for="query">Find a film</label>
      <input id="query" placeholder="Find a film" spellcheck="false">
    </form>
    <ul class="results" id="results"></ul>
    <p id="search-note">Pick one and it loads for both of you. A 1shows link pasted here works too.</p>
    <p id="last"></p>
  </section>

  <section class="stage" id="stage" hidden>
    <!-- No allowfullscreen: our own button fullscreens the page, so the pill survives. -->
    <iframe id="player" title="Film player" allow="autoplay; encrypted-media; picture-in-picture" referrerpolicy="origin"></iframe>
    <div class="hover-strip" id="strip"></div>

    <div class="pill asleep" id="pill">
      <span class="dot" id="dot"></span>
      <span id="status"></span>
      <button class="resync" id="resync" hidden>Resync</button>
      <span class="film" id="pill-film"></span>
      <span class="time" id="clock"></span>
      <button class="icon-button" id="fullscreen" aria-label="Fullscreen">
        <svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.5"><path d="M2 6V2h4M10 2h4v4M14 10v4h-4M6 14H2v-4"/></svg>
      </button>
    </div>

    <div class="curtain gone" id="curtain">
      <p>Syncing to <span class="time" id="curtain-time"></span></p>
      <div class="line" id="curtain-line"></div>
    </div>

    <div class="confirm" id="confirm" hidden>
      <p id="confirm-text"></p>
      <div class="row">
        <button class="quiet-button primary" id="confirm-yes">Switch</button>
        <button class="quiet-button" id="confirm-no">Keep watching</button>
      </div>
    </div>

    <div class="toast gone" id="toast"></div>
  </section>

  <section class="after" id="after" hidden>
    <div class="backdrop" id="backdrop"></div>
    <div class="after-body">
      <h1 id="after-title"></h1>
      <p class="facts" id="facts"></p>
      <div>
        <p class="tagline" id="tagline"></p>
        <p class="plot" id="plot"></p>
        <p class="about" id="about"></p>
        <dl class="credits" id="credits"></dl>
      </div>
      <aside class="verdict">
        <h2>What did you give it?</h2>
        <div class="stars" id="stars"></div>
        <p id="verdict-note">Both scores stay hidden until you have both picked one.</p>
        <div class="reveal" id="reveal" hidden></div>
        <button class="quiet-button" id="done">Done, back to the room</button>
      </aside>
    </div>
  </section>

  <script src="/room.js"></script>
</body>
</html>
